# smart-cli — the network client: a capnp consumer of the contract, nothing else.
#
# The architecture law (the founder's correction), made mechanical here:
#
#   The CLI does not know an implementation crate. Nothing knows an implementation crate. Every consumer
#   speaks capnp over the contract's transports, generating its OWN bindings
#   from the contract at build time. This crate's only dependency is the
#   CONTRACT (capnp runtime + the bindings build.rs generates from
#   ../smart-protocol-official/schema). There is no path dep on an implementation crate, no
#   re-export of it, and no link to it — proven by the Cargo.lock and a CI grep
#   (see knowledge/17-cli-proofs.md).
#
# Charter law #2 (zero-cost: you pay only for the features you enable) is the
# reason the manifest is shaped the way it is:
#
#   FEATURE = COMMAND FAMILY. Each `cmd-*` feature turns on the schema-binding
#   feature for its family (which drives build.rs to compile ONLY that family's
#   schemas + foundation + transitive imports) AND the command surface itself.
#   `--no-default-features --features cmd-dns` compiles DNS and links NOTHING
#   from the net schemas — the per-feature isolation proof.

[package]
name = "smart-cli"
version = "0.1.0"
edition = "2021"
description = "The network-domain CLI: a thin capnp client over the smart-protocol contract (no an implementation crate, no daemon coupling)."
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
name = "smart_cli"
path = "src/lib.rs"

# The CLI binary needs a command family AND the host I/O the `std` feature
# provides; every cmd-* feature implies std, but requiring both explicitly keeps
# `cargo run` from ever building a bin that cannot open a socket.
[[bin]]
name = "net"
path = "src/main.rs"
required-features = ["std"]

# The headless proof needs the network bindings + sockets; gating it keeps the
# per-feature isolation build (`--features cmd-dns`) from compiling the net
# schema into the example.
[[example]]
name = "agent_client"
required-features = ["schema-network", "std"]

[features]
# The default set is deliberately NOT "everything": the CLI ships the network
# family by default and a caller enables the siblings it wants.
default = ["cmd-net"]

# ─── std ────────────────────────────────────────────────────────
# The widening feature: capnp std support + the host-socket transports +
# std I/O for main. The library core stays no_std + alloc (charter law #1);
# `std` is the seam the CLI's real use hangs on.
#
# `capnp-rpc` is the contract's own CALL MODEL (rpc.capnp) — the runtime the
# generated clients and servers speak. It needs `std`, so it is part of this
# widening; `futures` is its executor (capnp-rpc already depends on it, so
# naming it directly adds no crate to the graph).
std = ["capnp/std", "capnp/alloc", "capnp-rpc", "futures"]

# ─── schema bindings (one per family; drives build.rs codegen) ───
# A schema-* feature compiles `<stem>.capnp` (+ foundation + transitive
# imports) and exposes the generated `schema::<stem>_capnp` module. Nothing
# else. This is the half the headless agent client links, with NO command
# surface — the AI-first path (knowledge/05-AI-FIRST-SURFACE.md §4).
schema-network = []
schema-dns = []
schema-bluetooth = []
schema-tunnel = []
schema-discovery = []
schema-web = []
schema-socket = []
# The six families the engine serves over the same contract (spine S1):
# files, process, settings, logging, clock, time. One .capnp per family —
# the same shape as the families above.
schema-files = []
schema-process = []
schema-settings = []
schema-logging = []
schema-clock = []
schema-time = []

# ─── command families (each implies its schema + std) ───────────
cmd-net = ["schema-network", "std"]
cmd-dns = ["schema-dns", "std"]
cmd-bt = ["schema-bluetooth", "std"]
cmd-tunnel = ["schema-tunnel", "std"]
cmd-discovery = ["schema-discovery", "std"]
cmd-web = ["schema-web", "std"]
cmd-socket = ["schema-socket", "std"]
# The six families the engine now serves (spine S1). Each is the same shape
# as the ones above: the family's own schema + the host I/O.
cmd-files = ["schema-files", "std"]
cmd-process = ["schema-process", "std"]
cmd-settings = ["schema-settings", "std"]
cmd-logging = ["schema-logging", "std"]
cmd-clock = ["schema-clock", "std"]
cmd-time = ["schema-time", "std"]

[dependencies]
# The runtime half of the capnp triad (capnp 0.27.x — the canonical contract's
# line). `default-features = false` + `alloc` keeps capnp itself no_std + alloc
# (law #1); `std` above widens it.
capnp = { version = "0.27.2", default-features = false, features = ["alloc"] }
# The contract's own call model: capnp RPC (rpc.capnp). The envelope on the
# wire is ITS envelope; the payload is the contract's own params/results.
capnp-rpc = { version = "0.27.0", optional = true }
# The executor capnp-rpc's futures are driven on (already in the graph through
# capnp-rpc; named here because the client drives it directly).
futures = { version = "0.3", features = ["executor"], optional = true }

[build-dependencies]
# The codegen half of the triad (capnpc 0.27.0 — the pure-Rust schema compiler
# that drives the system `capnp` binary, 1.4.0 on this box).
capnpc = "0.27.0"

# NOTE (the architecture law): there is no an implementation crate anywhere below — not a
# dependency, not a build-dependency, not a patch. `cargo tree` in this tree
# names capnp/capnpc/smart-cli only; the Cargo.lock has no an implementation crate entry.
